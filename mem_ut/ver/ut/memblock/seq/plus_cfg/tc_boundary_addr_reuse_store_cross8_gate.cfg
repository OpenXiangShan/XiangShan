# Software-only directed check for the no-reference address-reuse fallback.
# UID0 starts as a 2B Load x CROSS_8B entry, then LOAD_AFTER_STORE has no
# reference and converts it to a 2B Store while the Store cross-8B gate is off.
+MEMBLOCK_MAIN_TRANS_NUM=1
+MEMBLOCK_USE_MANUAL_MAIN_TABLE=0
+MEMBLOCK_CONTROL_WORKER_TOPOLOGY_MODE=0
+MEMBLOCK_OP_CLASS_INT_LOAD_WT=1
