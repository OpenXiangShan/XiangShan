+MEMBLOCK_ADDR_REUSE_STORE_AFTER_LOAD_WT=0
+MEMBLOCK_ADDR_REUSE_STORE_AFTER_STORE_WT=0
+MEMBLOCK_MAIN_VADDR_BASE=80000000
+MEMBLOCK_MAIN_VADDR_RANGE=10000000
