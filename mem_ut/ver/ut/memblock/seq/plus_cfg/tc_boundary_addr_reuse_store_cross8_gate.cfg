+MEMBLOCK_OP_CLASS_STORE_WT=0
+MEMBLOCK_OP_CLASS_PREFETCH_WT=0
+MEMBLOCK_OP_CLASS_AMO_WT=0
+MEMBLOCK_OP_CLASS_CBO_WT=0
+MEMBLOCK_LOAD_FUOP_LB_WT=0
+MEMBLOCK_LOAD_FUOP_LH_WT=1
+MEMBLOCK_LOAD_FUOP_LW_WT=0
+MEMBLOCK_LOAD_FUOP_LD_WT=0
+MEMBLOCK_LOAD_FUOP_LBU_WT=0
+MEMBLOCK_LOAD_FUOP_LHU_WT=0
+MEMBLOCK_LOAD_FUOP_LWU_WT=0
+MEMBLOCK_STORE_FUOP_SB_WT=0
+MEMBLOCK_STORE_FUOP_SH_WT=1
+MEMBLOCK_STORE_FUOP_SW_WT=0
+MEMBLOCK_STORE_FUOP_SD_WT=0
+MEMBLOCK_BOUNDARY_PROFILE_GEN_EN=1
+MEMBLOCK_BOUNDARY_ALIGNED_WT=0
