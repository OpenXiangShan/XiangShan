# Deterministic PPN reuse smoke: one completed normal response is immediately reusable.
+MEMBLOCK_L2TLB_PPN_REUSE_EN=1
+MEMBLOCK_L2TLB_PPN_REUSE_HISTORY_SIZE=1
+MEMBLOCK_L2TLB_PPN_REUSE_WT=100
+MEMBLOCK_L2TLB_LEVEL_WEIGHT_EN=0
+MEMBLOCK_MAIN_MEM_RANGES_EN=0

# 复用策略与地址窗口重选是独立随机源；本专项固定后者，才能逐项比较builder基线。
# 非法地址仍由routed策略强制重选，不关闭B08保护。
+MEMBLOCK_L2TLB_PPN_REGION_RANDOM_WT=0
+MEMBLOCK_L2TLB_PPN_REGION_ID=-1
