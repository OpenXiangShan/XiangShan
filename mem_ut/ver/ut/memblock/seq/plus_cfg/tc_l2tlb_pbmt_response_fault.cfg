# V2 real-DUT PBMT dynamic response-fault smoke.
# Run with tc=basicTest ts=memblock_l2tlb_pbmt_response_fault_vseq.
+MEMBLOCK_MAIN_TRANS_NUM=3
+MEMBLOCK_USE_MANUAL_MAIN_TABLE=0
+MEMBLOCK_CONTROL_WORKER_TOPOLOGY_MODE=0

# The directed CSR producer starts enabled, then owns the 1 -> 0 -> 1 transition.
+MEMBLOCK_MMU_SV39_M_PBMTE_EN=1
+MEMBLOCK_MMU_SV39_H_PBMTE_EN=0
+MEMBLOCK_CSR_CONTROL_ENABLE=0
+MEMBLOCK_SFENCE_CONTROL_ENABLE=0

+MEMBLOCK_ENQ_PER_CYCLE=1
+MEMBLOCK_LOAD_PIP_NUM_LIMIT=1
+MEMBLOCK_STA_PIP_NUM_LIMIT=1
+MEMBLOCK_STD_PIP_NUM_LIMIT=1
+MEMBLOCK_DISPATCH_ISSUE_SEQ_EN=1
+MEMBLOCK_DISPATCH_ISSUE_NONBLOCKING_EN=0
+MEMBLOCK_LSQENQ_SEQ_EN=1
+MEMBLOCK_LSQCOMMIT_SEQ_EN=1
+MEMBLOCK_L2TLB_SEQ_EN=1
+MEMBLOCK_ACTIVE_SEQ_NO_PROGRESS_WARN_CYCLES=60000
+MEMBLOCK_LSQENQ_READY_TIMEOUT=5000
+MEMBLOCK_DISPATCH_READY_TIMEOUT=5000

# No random translation fault obscures the PBMT-induced S1 PF on B.
+MEMBLOCK_L2TLB_S1_PF_1_WT=0
+MEMBLOCK_L2TLB_S1_AF_1_WT=0
+MEMBLOCK_L2TLB_S2_GPF_1_WT=0
+MEMBLOCK_L2TLB_S2_GAF_1_WT=0
+MEMBLOCK_L2TLB_S1_PTE_MODE=0
+MEMBLOCK_L2TLB_S1_PTE_R_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_W_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_X_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_U_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_G_1_WT=0
+MEMBLOCK_L2TLB_S1_PTE_A_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_D_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_N_1_WT=0
+MEMBLOCK_L2TLB_S1_PTE_V_1_WT=100

# Force one nonzero S1 PBMT on the raw entry created by A.
+MEMBLOCK_L2TLB_S1_PBMT_0_WT=0
+MEMBLOCK_L2TLB_S1_PBMT_1_WT=100
+MEMBLOCK_L2TLB_S1_PBMT_2_WT=0
+MEMBLOCK_L2TLB_S2_PBMT_0_WT=100
+MEMBLOCK_L2TLB_S2_PBMT_1_WT=0
+MEMBLOCK_L2TLB_S2_PBMT_2_WT=0

# A/B/C use two 4KB VPNs in one forced S1 2MB superpage. C must miss the
# Store DTLB fault cache from B but range-hit the same L2TLB raw entry.
+MEMBLOCK_L2TLB_LEVEL_WEIGHT_EN=1
+MEMBLOCK_L2TLB_S1_LEVEL_0_WT=0
+MEMBLOCK_L2TLB_S1_LEVEL_1_WT=100
+MEMBLOCK_L2TLB_S1_LEVEL_2_WT=0
+MEMBLOCK_L2TLB_S1_LEVEL_3_WT=0

+MEMBLOCK_MAIN_VADDR_BASE=80000000
+MEMBLOCK_MAIN_VADDR_RANGE=10000000
+MEMBLOCK_PADDR_BASE=80000000
+MEMBLOCK_PADDR_RANGE=10000000
# 固定 L2TLB level 权重需要 sparse memory mode；root PPN 仍从 PADDR_BASE 取得。
+MEMBLOCK_MAIN_MEM_RANGES_EN=0
+MEMBLOCK_PMA_PMP_MODEL_EN=0

+MEMBLOCK_L2TLB_MAX_OUTSTANDING=1
+MEMBLOCK_L2TLB_RESP_REORDER_EN=0
+MEMBLOCK_L2TLB_RESP_1C_WT=100
+MEMBLOCK_L2TLB_RESP_MID_WT=0
+MEMBLOCK_L2TLB_RESP_LONG_WT=0
+MEMBLOCK_L2TLB_IDLE_STOP_CYCLE=5000

+MEMBLOCK_L2_GRANTDATA_DENIED_WT=0
+MEMBLOCK_L2_GRANTDATA_CORRUPT_WT=0
+MEMBLOCK_UNCACHE_DENIED_WT=0
+MEMBLOCK_UNCACHE_CORRUPT_WT=0
