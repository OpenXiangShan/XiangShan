# basicTest 的最小 active-control 闭环：UID 0 为普通 load，UID 1 为固定 check_store。
# CSR/SFence 随机预约保持关闭，专项只验证 flushSb -> L2 flush level -> worker shutdown。
+VSEQ_MAIN=memblock_dispatch_real_smoke_vseq
+MEMBLOCK_CONTROL_WORKER_TOPOLOGY_MODE=1
+MEMBLOCK_USE_MANUAL_MAIN_TABLE=0
+MEMBLOCK_MAIN_TRANS_NUM=1
+MEMBLOCK_CSR_CONTROL_ENABLE=0
+MEMBLOCK_CSR_CONTROL_MIN_INTERVAL=1
+MEMBLOCK_CSR_CONTROL_MAX_INTERVAL=1
+MEMBLOCK_SFENCE_CONTROL_ENABLE=0
+MEMBLOCK_SFENCE_CONTROL_MIN_INTERVAL=1
+MEMBLOCK_SFENCE_CONTROL_MAX_INTERVAL=1

+MEMBLOCK_OP_CLASS_INT_LOAD_WT=1
+MEMBLOCK_OP_CLASS_FP_LOAD_WT=0
+MEMBLOCK_OP_CLASS_STORE_WT=0
+MEMBLOCK_OP_CLASS_PREFETCH_WT=0
+MEMBLOCK_OP_CLASS_AMO_WT=0
+MEMBLOCK_OP_CLASS_CBO_WT=0

+MEMBLOCK_LSQENQ_SEQ_EN=1
+MEMBLOCK_DISPATCH_ISSUE_SEQ_EN=1
+MEMBLOCK_DISPATCH_ISSUE_NONBLOCKING_EN=0
+MEMBLOCK_LSQCOMMIT_SEQ_EN=1
+MEMBLOCK_ENQ_PER_CYCLE=1
+MEMBLOCK_ACTIVE_SEQ_NO_PROGRESS_WARN_CYCLES=60000
+MEMBLOCK_FLUSHSB_SEQ_EN=0
+MEMBLOCK_FLUSHSB_TIMEOUT=5000

+MEMBLOCK_L2TLB_SEQ_EN=1
+MEMBLOCK_L2TLB_IDLE_STOP_CYCLE=5000
+MEMBLOCK_L2TLB_S1_PTE_R_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_W_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_A_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_D_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_V_1_WT=100
+MEMBLOCK_LSQENQ_READY_TIMEOUT=5000
+MEMBLOCK_DISPATCH_READY_TIMEOUT=5000
