# V2 strict-NC real-DUT stress: run with
#   tc=basicTest ts=memblock_dispatch_real_smoke_vseq
# This preset intentionally does not inherit the mixed PBMT Sv39 smoke.

# 100k scalar Load/Store requests, without CSR/SFence process switching.
+MEMBLOCK_MAIN_TRANS_NUM=100000
+MEMBLOCK_USE_MANUAL_MAIN_TABLE=0
+MEMBLOCK_CONTROL_WORKER_TOPOLOGY_MODE=0
+MEMBLOCK_CSR_CONTROL_ENABLE=0
+MEMBLOCK_CSR_CONTROL_MIN_INTERVAL=1
+MEMBLOCK_CSR_CONTROL_MAX_INTERVAL=1
+MEMBLOCK_SFENCE_CONTROL_ENABLE=0
+MEMBLOCK_SFENCE_CONTROL_MIN_INTERVAL=1
+MEMBLOCK_SFENCE_CONTROL_MAX_INTERVAL=1

# Static Sv39/U translation.  S1 is the active stage in this scenario.
+MEMBLOCK_MMU_SV39_M_PBMTE_EN=1
+MEMBLOCK_MMU_SV39_H_PBMTE_EN=0

# Keep the pressure source to scalar integer Load/Store only.
+MEMBLOCK_ENQ_PER_CYCLE=1
+MEMBLOCK_ENQ_PER_CYCLE_RAND_EN=0
+MEMBLOCK_ENQ_PER_CYCLE_ZERO_WEIGHT=0
+MEMBLOCK_ENQ_PER_CYCLE_MIDDLE_WEIGHT=0
+MEMBLOCK_ENQ_PER_CYCLE_MAX_WEIGHT=1
+MEMBLOCK_LOAD_PIP_NUM_LIMIT=3
+MEMBLOCK_STA_PIP_NUM_LIMIT=2
+MEMBLOCK_STD_PIP_NUM_LIMIT=2
+MEMBLOCK_LOAD_PIP_NUM_RANDOM_EN=0
+MEMBLOCK_STA_PIP_NUM_RANDOM_EN=0
+MEMBLOCK_STD_PIP_NUM_RANDOM_EN=0
+MEMBLOCK_OP_CLASS_INT_LOAD_WT=1
+MEMBLOCK_OP_CLASS_FP_LOAD_WT=0
+MEMBLOCK_OP_CLASS_STORE_WT=1
+MEMBLOCK_OP_CLASS_PREFETCH_WT=0
+MEMBLOCK_OP_CLASS_AMO_WT=0
+MEMBLOCK_OP_CLASS_CBO_WT=0
+MEMBLOCK_LOAD_FUOP_LB_WT=1
+MEMBLOCK_LOAD_FUOP_LH_WT=1
+MEMBLOCK_LOAD_FUOP_LW_WT=1
+MEMBLOCK_LOAD_FUOP_LD_WT=1
+MEMBLOCK_LOAD_FUOP_LBU_WT=1
+MEMBLOCK_LOAD_FUOP_LHU_WT=1
+MEMBLOCK_LOAD_FUOP_LWU_WT=1
+MEMBLOCK_STORE_FUOP_SB_WT=1
+MEMBLOCK_STORE_FUOP_SH_WT=1
+MEMBLOCK_STORE_FUOP_SW_WT=1
+MEMBLOCK_STORE_FUOP_SD_WT=1

# Force both normal and unaligned scalar accesses; include the NC cross-16B
# Store shape while excluding unrelated cross-cacheline and cross-page stress.
+MEMBLOCK_BOUNDARY_PROFILE_GEN_EN=1
+MEMBLOCK_BOUNDARY_ALIGNED_WT=50
+MEMBLOCK_BOUNDARY_MISALIGN_WITHIN_8B_WT=10
+MEMBLOCK_BOUNDARY_CROSS_8B_WITHIN_16B_WT=15
+MEMBLOCK_BOUNDARY_CROSS_16B_SAME_LINE_WT=25
+MEMBLOCK_BOUNDARY_CROSS_CACHELINE_SAME_4K_WT=0
+MEMBLOCK_BOUNDARY_CROSS_4K_WT=0
+MEMBLOCK_STORE_CROSS_8B_WITHIN_16B_EN=1

# Do not let address reuse turn a previous fault entry into the dominant path.
+MEMBLOCK_ADDR_REUSE_EN_1_WT=0
+MEMBLOCK_ADDR_REUSE_EN_0_WT=100
+MEMBLOCK_ADDR_REUSE_LOAD_AFTER_STORE_WT=1
+MEMBLOCK_ADDR_REUSE_LOAD_AFTER_LOAD_WT=1
+MEMBLOCK_ADDR_REUSE_STORE_AFTER_LOAD_WT=1
+MEMBLOCK_ADDR_REUSE_STORE_AFTER_STORE_WT=1
+MEMBLOCK_ADDR_REUSE_KEEP_REF_SIZE_EN_1_WT=0
+MEMBLOCK_ADDR_REUSE_KEEP_REF_SIZE_EN_0_WT=1
+MEMBLOCK_ADDR_REF_WINDOW_FIXED=0
+MEMBLOCK_ADDR_REF_WINDOW_SMALL_WEIGHT=1
+MEMBLOCK_ADDR_REF_WINDOW_MEDIUM_WEIGHT=0
+MEMBLOCK_ADDR_REF_WINDOW_LARGE_WEIGHT=0
+MEMBLOCK_ROB_START_FIXED_EN=1
+MEMBLOCK_ROB_START_FIXED_VALUE=0
+MEMBLOCK_ROB_START_ZERO_WT=1
+MEMBLOCK_ROB_START_MID_WT=0
+MEMBLOCK_ROB_START_NEAR_WRAP_WT=0
+MEMBLOCK_DELAY_0_WT=100
+MEMBLOCK_DELAY_1_20_WT=0
+MEMBLOCK_DELAY_21_50_WT=0
+MEMBLOCK_MDP_LOAD_WAIT_WT=0
+MEMBLOCK_MDP_STORESET_HIT_WT=0
+MEMBLOCK_LOAD_WAIT_STRICT_WT=0
+MEMBLOCK_RVC_WT=0

# Legal S1 PTEs avoid permission/page-fault noise.  S1 AF remains the
# intentional architectural access-fault source for this preset.
+MEMBLOCK_L2TLB_LEVEL_WEIGHT_EN=0
+MEMBLOCK_L2TLB_S1_PF_1_WT=0
+MEMBLOCK_L2TLB_S1_AF_1_WT=5
+MEMBLOCK_L2TLB_S2_GPF_1_WT=0
+MEMBLOCK_L2TLB_S2_GAF_1_WT=0
+MEMBLOCK_L2TLB_S1_LEVEL_0_WT=100
+MEMBLOCK_L2TLB_S1_LEVEL_1_WT=0
+MEMBLOCK_L2TLB_S1_LEVEL_2_WT=0
+MEMBLOCK_L2TLB_S1_LEVEL_3_WT=0
+MEMBLOCK_L2TLB_S2_LEVEL_0_WT=100
+MEMBLOCK_L2TLB_S2_LEVEL_1_WT=0
+MEMBLOCK_L2TLB_S2_LEVEL_2_WT=0
+MEMBLOCK_L2TLB_S2_LEVEL_3_WT=0
+MEMBLOCK_L2TLB_S1_PTE_MODE=0
+MEMBLOCK_L2TLB_S2_PTE_MODE=0
+MEMBLOCK_L2TLB_S1_PTE_R_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_W_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_X_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_U_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_G_1_WT=0
+MEMBLOCK_L2TLB_S1_PTE_A_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_D_1_WT=100
+MEMBLOCK_L2TLB_S1_PTE_N_1_WT=0
+MEMBLOCK_L2TLB_S1_PTE_V_1_WT=100
+MEMBLOCK_L2TLB_S2_PTE_R_1_WT=100
+MEMBLOCK_L2TLB_S2_PTE_W_1_WT=100
+MEMBLOCK_L2TLB_S2_PTE_X_1_WT=100
+MEMBLOCK_L2TLB_S2_PTE_U_1_WT=100
+MEMBLOCK_L2TLB_S2_PTE_G_1_WT=0
+MEMBLOCK_L2TLB_S2_PTE_A_1_WT=100
+MEMBLOCK_L2TLB_S2_PTE_D_1_WT=100
+MEMBLOCK_L2TLB_S2_PTE_N_1_WT=0

# PBMT=01 is NC.  PBMT=10 (IO/MMIO) and PBMT=00 are prohibited.
+MEMBLOCK_L2TLB_S1_PBMT_0_WT=0
+MEMBLOCK_L2TLB_S1_PBMT_1_WT=100
+MEMBLOCK_L2TLB_S1_PBMT_2_WT=0
+MEMBLOCK_L2TLB_S2_PBMT_0_WT=0
+MEMBLOCK_L2TLB_S2_PBMT_1_WT=100
+MEMBLOCK_L2TLB_S2_PBMT_2_WT=0

# The PA range is cacheable main memory by PMA; PBMT=01 therefore supplies
# the NC property instead of selecting an MMIO PMA region.
+MEMBLOCK_MAIN_VADDR_BASE=80000000
+MEMBLOCK_MAIN_VADDR_RANGE=10000000
+MEMBLOCK_PADDR_BASE=80000000
+MEMBLOCK_PADDR_RANGE=10000000
+MEMBLOCK_MAIN_MEM_RANGES_EN=1
+MEMBLOCK_PMA_PMP_MODEL_EN=1
+MEMBLOCK_PMA_PMP_RAW_COMPARE_EN=1
+MEMBLOCK_PMA_PMP_XMR_CHECK_EN=0
+MEMBLOCK_PMA_PMP_UNDEFINED_AFTER_TLB_FAULT=1
+MEMBLOCK_HARD_XZ_CHECK_EN=1

# Keep normal response paths deterministic: no injected DCache/Uncache errors
# or reordering.  NC requests are serviced by the Uncache responder.
+MEMBLOCK_ACTIVE_SEQ_NO_PROGRESS_WARN_CYCLES=10000
+MEMBLOCK_DISPATCH_ISSUE_SEQ_EN=1
+MEMBLOCK_DISPATCH_ISSUE_NONBLOCKING_EN=0
+MEMBLOCK_DISPATCH_READY_TIMEOUT=5000
+MEMBLOCK_REDIRECT_SEQ_EN=1
+MEMBLOCK_REDIRECT_DRIVE_TIMEOUT=5000
+MEMBLOCK_REDIRECT_FREEZE_TIMEOUT=5000
+MEMBLOCK_STA_REAL_WB_PASS_EN=1
+MEMBLOCK_LSQENQ_SEQ_EN=1
+MEMBLOCK_LSQENQ_READY_TIMEOUT=5000
+MEMBLOCK_LSQCOMMIT_SEQ_EN=1
+MEMBLOCK_FLUSHSB_SEQ_EN=0
+MEMBLOCK_FLUSHSB_REQUEST_CYCLE=0
+MEMBLOCK_FLUSHSB_TIMEOUT=5000
+MEMBLOCK_REPLAY_WAIT_PTW_EN=0
+MEMBLOCK_REPLAY_WAIT_PTW_TIMEOUT=5000
+MEMBLOCK_L2_RSP_DELAY_ZERO_WT=100
+MEMBLOCK_L2_RSP_DELAY_SMALL_WT=0
+MEMBLOCK_L2_RSP_DELAY_MEDIUM_WT=0
+MEMBLOCK_L2_RSP_DELAY_LARGE_WT=0
+MEMBLOCK_UNCACHE_RSP_DELAY_ZERO_WT=100
+MEMBLOCK_UNCACHE_RSP_DELAY_SMALL_WT=0
+MEMBLOCK_UNCACHE_RSP_DELAY_MEDIUM_WT=0
+MEMBLOCK_UNCACHE_RSP_DELAY_LARGE_WT=0
+MEMBLOCK_L2_RSP_REORDER_EN=0
+MEMBLOCK_UNCACHE_RSP_REORDER_EN=0
+MEMBLOCK_L2_D_ERROR_STICKY_EN=0
+MEMBLOCK_L2_GRANTDATA_DENIED_WT=0
+MEMBLOCK_L2_GRANTDATA_CORRUPT_WT=0
+MEMBLOCK_L2_CBO_ACK_DENIED_WT=0
+MEMBLOCK_L2_CBO_ACK_CORRUPT_WT=0
+MEMBLOCK_UNCACHE_DENIED_WT=0
+MEMBLOCK_UNCACHE_CORRUPT_WT=0
+MEMBLOCK_L2_HINT_VALID_WT=0
+MEMBLOCK_L2_PROBE_EN=0
+MEMBLOCK_L2_PROBE_PRE_START_WT=1
+MEMBLOCK_L2_PROBE_COUNT_ONE_WT=1
+MEMBLOCK_L2_PROBE_COUNT_MID_WT=0
+MEMBLOCK_L2_PROBE_COUNT_LARGE_WT=0
+MEMBLOCK_L2_PROBE_TO_B_WT=0

+MEMBLOCK_L2TLB_SEQ_EN=1
+MEMBLOCK_L2TLB_MAX_OUTSTANDING=8
+MEMBLOCK_L2TLB_RESP_REORDER_EN=0
+MEMBLOCK_L2TLB_RESP_MID_LATENCY=4
+MEMBLOCK_L2TLB_RESP_LONG_LATENCY=16
+MEMBLOCK_L2TLB_RESP_1C_WT=100
+MEMBLOCK_L2TLB_RESP_MID_WT=0
+MEMBLOCK_L2TLB_RESP_LONG_WT=0
+MEMBLOCK_L2TLB_IDLE_STOP_CYCLE=5000
