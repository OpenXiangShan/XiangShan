  <text x="98" y="324" class="sectionTitle">01  测试框架与参考模型</text>

  <text x="98" y="383" class="blockTitle">测试框架：修复17项Bug</text>
  <rect x="98" y="403" width="360" height="45" rx="6" fill="#edf3f8"/>
  <rect x="478" y="403" width="360" height="45" rx="6" fill="#edf3f8"/>
  <rect x="98" y="462" width="360" height="45" rx="6" fill="#edf3f8"/>
  <rect x="478" y="462" width="360" height="45" rx="6" fill="#edf3f8"/>
  <text x="116" y="432" class="bodyStrong">Owner/Redirect/Barrier生命周期：8项</text>
  <text x="496" y="432" class="bodyStrong">配置、参数与回归矩阵：5项</text>
  <text x="116" y="491" class="bodyStrong">地址生成与定向场景：3项</text>
  <text x="496" y="491" class="bodyStrong">并行回归退出竞态：1项</text>

  <text x="98" y="548" class="blockTitle">新增AMO支持</text>
  <text x="112" y="580" class="body">• AMO、LR/SC和AMOCAS指令激励</text>
  <text x="112" y="609" class="body">• LSQ Admission与Atomic Owner管理</text>
  <text x="112" y="638" class="body">• STA/STD乱序发射与Slot管理</text>
  <text x="462" y="580" class="body">• LR/SC配对、非对齐地址控制</text>
  <text x="462" y="609" class="body">• 异常Redirect及重新入队发射</text>
  <text x="462" y="638" class="body">• AMOCAS.W/D/Q Compare Prefill</text>

  <line x1="98" y1="671" x2="838" y2="671" stroke="#d8dee7" stroke-width="1.5"/>
  <text x="98" y="710" class="blockTitle">参考模型：修复4项Bug</text>
  <text x="112" y="744" class="body">1. PBMT-NC/IO异常类型判断错误</text>
  <text x="112" y="775" class="body">2. PMA/PMP动态CSR消费断链</text>
  <text x="462" y="744" class="body">3. Later-split响应来源关联错误</text>
  <text x="462" y="775" class="body">4. 首段异常终止后仍检查第二页</text>

  <rect x="98" y="810" width="740" height="42" rx="6" fill="#fdebed"/>
  <text x="116" y="838" class="bodyStrong">DUT：确认1项NC返回跨Redirect产生旧LDA写回的RTL缺陷</text>

