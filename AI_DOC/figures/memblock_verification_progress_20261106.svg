  <text x="970" y="450" class="bodyStrong">激励生成 → LSQ入队 → RTL执行 → 写回更新状态</text>
  <text x="970" y="476" class="small">已完成向量发射、L2TLB/Cache复用、结果采集与恢复的主要开发</text>

