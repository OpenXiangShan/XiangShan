<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#152238" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 48px 'Noto Serif CJK SC', sans-serif; fill: #152238; }
      .date { font: 400 19px 'Noto Serif CJK SC', sans-serif; fill: #647185; }
      .metricNum { font: 700 37px 'Noto Serif CJK SC', sans-serif; fill: #152238; }
      .metricLabel { font: 500 16px 'Noto Serif CJK SC', sans-serif; fill: #647185; }
      .sectionTitle { font: 700 25px 'Noto Serif CJK SC', sans-serif; fill: #ffffff; }
