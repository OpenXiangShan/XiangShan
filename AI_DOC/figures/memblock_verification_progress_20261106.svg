  <rect x="948" y="728" width="174" height="85" rx="7" fill="#26374d"/>
  <rect x="1138" y="728" width="174" height="85" rx="7" fill="#315f5a"/>
  <rect x="1328" y="728" width="174" height="85" rx="7" fill="#755a34"/>
  <rect x="1518" y="728" width="184" height="85" rx="7" fill="#5d476d"/>
  <text x="1035" y="765" class="percent" text-anchor="middle">41</text>
  <text x="1035" y="794" class="white" text-anchor="middle">条宏指令</text>
  <text x="1225" y="765" class="percent" text-anchor="middle">80</text>
  <text x="1225" y="794" class="white" text-anchor="middle">个DATA uop</text>
