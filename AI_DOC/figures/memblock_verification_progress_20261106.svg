  <rect x="1370" y="151" width="8" height="104" rx="4" fill="#8a5da8"/>
  <text x="104" y="199" class="metricNum">17</text><text x="104" y="229" class="metricLabel">测试框架Bug修复</text>
  <text x="429" y="199" class="metricNum">4</text><text x="429" y="229" class="metricLabel">参考模型Bug修复</text>
