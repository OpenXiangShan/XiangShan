[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memblock-toffee-verification"
version = "0.1.0"
description = "Toffee-based MemBlock verification framework"
requires-python = ">=3.11"
dependencies = [
  "pytoffee>=0.3.1",
  "toffee-test>=0.3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "toffee_unit: framework tests that do not load the generated DUT",
  "toffee_smoke: generated-DUT initialization and quiescence tests",
  "toffee_control: top-level control and flush protocol tests",
  "toffee_regression: native Toffee regression tests",
  "toffee_trace: tests requiring retained waveform or trace artifacts",
]
