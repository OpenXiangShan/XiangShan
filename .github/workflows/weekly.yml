name: Weekly Regression

on:
  schedule:
    #run at 10:00 UTC (18:00 UTC+8) on Friday
    - cron: '0 10 * * 5'
  workflow_dispatch:
    inputs:
      test_branch:
        description: Only fill this option when retrying with the same branch/commit as previous attempts
        required: false
        type: string
        default: kunminghu-v3

jobs:
  run:
    name: Run SPEC06 GCC16 Performance Test
    uses: ./.github/workflows/perf-template.yml
    with:
      test_branch: ${{ github.event.inputs.test_branch }}
      benchmark_type: spec06-rva23-novec-gcc16-1.0c
      high_priority: true

  run-xscc:
    name: Run SPEC06 XSCC Performance Test
    uses: ./.github/workflows/perf-template.yml
    with:
      test_branch: ${{ github.event.inputs.test_branch }}
      benchmark_type: spec06-rv64gcb-xscc-1.0c
      artifact_name: score-xscc
      high_priority: true

  run-spec17:
    name: Run SPEC17 GCC16 Performance Test
    uses: ./.github/workflows/perf-template.yml
    with:
      test_branch: ${{ github.event.inputs.test_branch }}
      benchmark_type: spec17-rva23-novec-gcc16-1.0c
      artifact_name: score-spec17
      high_priority: true
