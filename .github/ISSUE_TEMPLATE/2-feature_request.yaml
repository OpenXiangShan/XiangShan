name: Feature request
description: Suggest an idea for XiangShan project.
labels:
  - 'type: feature/requested'
body:
  - type: markdown
    attributes:
      value: |
        This template is only for proposing ideas, feature requests, or improvement suggestions for the XiangShan project. If this does not match your case, please go back and choose another template.

        这个 issue 模板仅用于向香山提出想法、建议、特性需求。如果您遇到的不是此类问题，请回退并选择其他模板。
  - type: checkboxes
    id: before-start
    attributes:
      label: Before start
      description: |
        Before you start, please read the [Before contributing](https://github.com/OpenXiangShan/XiangShan/blob/kunminghu-v3/CONTRIBUTING.md#before-contributing) section, and confirm the following items:

        开始之前，请阅读[贡献前须知](https://github.com/OpenXiangShan/XiangShan/blob/kunminghu-v3/CONTRIBUTING.zh-cn.md#贡献前须知)，并确认以下事项：
      options:
        - label: I have read the [RISC-V ISA Manual](https://github.com/riscv/riscv-isa-manual) and [XiangShan Documents](https://docs.xiangshan.cc/zh-cn/latest). 我已经阅读过 [RISC-V 指令集手册](https://github.com/riscv/riscv-isa-manual) 和 [香山文档](https://docs.xiangshan.cc/zh-cn/latest)。
          required: true
        - label: I have searched previous issues and PRs and did not find anything relevant. 我已经搜索过之前的 issue 和 PR，并没有找到相关的。
          required: true
  - type: textarea
    id: describe
    attributes:
      label: Describe the feature you'd like
      description: |
        A clear and concise description of what you want and your considerations behind it.

        请清晰、准确地描述您期望的特性，以及您的具体考虑。
      placeholder:
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Add any other relevant context here.

        可在此处附上其他相关信息。
      placeholder:
    validations:
      required: false
