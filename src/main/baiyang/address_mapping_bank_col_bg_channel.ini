# Saved baseline DFI virtual RAM address mapping for the bank-col-bg bandwidth
# check with channel interleave enabled.
#
# This is intentionally identical to address_mapping_bank_col_bg.ini at the
# time the no-channel experiment was added, so we can switch back explicitly.
#
# High-to-low order:
#   row[15:0] bank[1:0] col[6:0] bg[1:0] channel[0]
#
# Byte-address bits:
#   bit 6       -> channel[0]
#   bits 8:7    -> bg[1:0]
#   bits 15:9   -> col[6:0] packed from DFI col[9:3]
#   bits 17:16  -> bank[1:0]
#   bits 33:18  -> row[15:0]

[ram]
size = 16G

[address]
order = row[15:0], bank[1:0], col[6:0], bg[1:0], channel[0]
