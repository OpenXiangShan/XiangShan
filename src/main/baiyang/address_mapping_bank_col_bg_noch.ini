# DFI virtual RAM address mapping for the bank-col-bg bandwidth check with
# channel excluded from cacheline address reconstruction.
#
# Requested high-to-low order:
#   row[15:0] bank[1:0] col[6:0] bg[1:0]
#
# Byte-address bits:
#   bits 7:6    -> bg[1:0]
#   bits 14:8   -> col[6:0] packed from DFI col[9:3]
#   bits 16:15  -> bank[1:0]
#   bits 32:17  -> row[15:0]

[ram]
size = 16G

[address]
order = row[15:0], bank[1:0], col[6:0], bg[1:0]
